<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>{{ block "title" . }}{{ .Title }} – {{ .Site.Title }}{{ end }}</title>
  
  {{ if .IsHome }}
    <meta name="description" content="{{ .Site.Params.description }}">
  {{ else if .Params.description }}
    <meta name="description" content="{{ .Params.description }}">
  {{ end }}

  <!-- SEO/OG -->
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | default (truncate 150 .Content | plainify) }}{{ end }}{{ end }}">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}images/social-share.jpg">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  
  {{ hugo.Generator }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <!-- JavaScript -->
  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
