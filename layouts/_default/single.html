{{ define "main" }}
  <article class="container">
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      {{ if .Params.featured_image }}
        <div class="featured-image">
          <img src="{{ .Params.featured_image | relURL }}" alt="{{ .Title }}">
        </div>
      {{ end }}
    </header>
    
    <div class="article-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
