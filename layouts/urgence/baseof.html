<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <title>{{ block "title" . }}{{ .Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --urgence-red: #ef4444;
            --urgence-dark: #111827;
            --urgence-green: #22c55e;
            --text-gray: #d1d5db;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--urgence-dark);
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            padding-bottom: 100px;
            /* Espace pour sticky bar */
        }

        /* Utilitaires simples */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .text-center {
            text-align: center;
        }

        .font-bold {
            font-weight: 700;
        }

        .my-4 {
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        .urgence-header {
            background: var(--urgence-red);
            color: white;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .urgence-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 0.3rem;
        }

        .sticky-sos-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--urgence-dark);
            padding: 1rem;
            border-top: 1px solid #374151;
            z-index: 1000;
            display: flex;
            justify-content: center;
        }

        .sos-btn {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--urgence-green);
            color: var(--urgence-dark);
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(34, 197, 68, 0.3);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(34, 197, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 68, 0);
            }
        }
    </style>
</head>

<body>

    {{ block "main" . }}{{ end }}

</body>

</html>
