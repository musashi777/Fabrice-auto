<header class="site-header">
  <div class="container header-inner">
    <div class="logo">
      <a href="{{ "/" | relURL }}">
        <span class="logo-main">{{ .Site.Title }}</span>
        <span class="logo-sub">Nettoyage & Rénovation</span>
      </a>
    </div>
    
    <button class="menu-toggle" aria-label="Menu principal" aria-expanded="false">
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>

    <nav class="main-nav" role="navigation" aria-label="Navigation principale">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}active{{ end }}" {{ if not (hasPrefix .URL "#") }}aria-current="{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}page{{ end }}"{{ end }}>
          {{ .Name }}
        </a>
      {{ end }}
      <a href="tel:{{ replace .Site.Params.phone " " "" }}" class="nav-cta" aria-label="Appeler {{ .Site.Params.phone }}">
        📞 {{ .Site.Params.phone }}
      </a>
    </nav>
  </div>
</header>
